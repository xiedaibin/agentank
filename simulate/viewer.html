<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgenTank 离线可视化播放器</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --accent-red: #ff7b72;
            --accent-blue: #58a6ff;
            --accent-gold: #d29922;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .canvas-area {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            border-right: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .canvas-container {
            position: relative;
            background-color: #000;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
        }

        .controls {
            margin-top: 20px;
            width: 100%;
            max-width: 600px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .timeline-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timeline {
            flex: 1;
            cursor: pointer;
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            outline: none;
            accent-color: var(--accent-blue);
        }

        .time-label {
            font-family: monospace;
            font-size: 13px;
            min-width: 65px;
            text-align: right;
        }

        .btn-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            background-color: #21262d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        button.active {
            background-color: #1f6feb;
            border-color: #58a6ff;
            color: #fff;
        }

        .speed-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .log-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #090d13;
            overflow: hidden;
        }

        .panel-header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-panel {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background-color: rgba(22, 27, 34, 0.4);
        }

        .tank-status {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .tank-status.challenger {
            border-left: 4px solid var(--accent-red);
        }

        .tank-status.defender {
            border-left: 4px solid var(--accent-blue);
        }

        .tank-status strong {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .tank-status span {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
        }

        .event-log {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 8px;
            border-bottom: 1px dotted #21262d;
            padding-bottom: 4px;
        }

        .log-entry.highlight {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .log-entry.crash {
            color: var(--accent-red);
            font-weight: bold;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <h1>AgenTank 离线对战播放器</h1>
        <div class="file-input-wrapper">
            <button>加载外部 Replay 文件</button>
            <input type="file" id="fileLoader" accept=".json">
        </div>
    </header>

    <div class="container">
        <!-- 左侧画布与播放控制 -->
        <div class="canvas-area">
            <div class="canvas-container">
                <canvas id="stageCanvas"></canvas>
            </div>

            <div class="controls">
                <div class="timeline-container">
                    <input type="range" class="timeline" id="timeSlider" min="0" max="0" value="0">
                    <span class="time-label" id="timeLabel">0 / 0 帧</span>
                </div>
                <div class="btn-row">
                    <div class="btn-group">
                        <button id="prevBtn" title="上一帧">◀</button>
                        <button id="playBtn" class="active">暂停</button>
                        <button id="nextBtn" title="下一帧">▶</button>
                        <button id="restartBtn">重置</button>
                    </div>
                    <div class="btn-group" style="align-items: center;">
                        <span class="speed-label">倍速:</span>
                        <button class="speed-btn" data-speed="1">1x</button>
                        <button class="speed-btn active" data-speed="2">2x</button>
                        <button class="speed-btn" data-speed="5">5x</button>
                        <button class="speed-btn" data-speed="10">10x</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧状态与日志 -->
        <div class="log-area">
            <div class="panel-header">
                <span>对战状态监测</span>
                <span id="matchWinner" style="color: var(--accent-gold);">Winner: 运行中...</span>
            </div>

            <div class="status-panel">
                <div class="tank-status challenger">
                    <strong id="p0Name">Challenger</strong>
                    <span id="p0Pos">坐标: [-, -]</span>
                    <span id="p0Stars">星星: 0 ★</span>
                    <span id="p0Bullets">子弹: 0 / -</span>
                </div>
                <div class="tank-status defender">
                    <strong id="p1Name">Defender</strong>
                    <span id="p1Pos">坐标: [-, -]</span>
                    <span id="p1Stars">星星: 0 ★</span>
                    <span id="p1Bullets">子弹: 0 / -</span>
                </div>
            </div>

            <div class="panel-header" style="border-top: 1px solid var(--border-color);">
                <span>逐帧对局日志 (Replay Log)</span>
            </div>
            <div class="event-log" id="eventLogPanel">
                <!-- 日志输出 -->
            </div>
        </div>
    </div>

    <script>
        const TILE = 40;
        let replayData = null;
        let currentFrame = 0;
        let isPlaying = false;
        let playSpeed = 2; // 默认每秒播放帧数 = 2 * 10 帧
        let timer = null;

        function clone(obj) {
            return JSON.parse(JSON.stringify(obj));
        }

        const turnLeft = { up: "left", left: "down", down: "right", right: "up" };
        const turnRight = { up: "right", right: "down", down: "left", left: "up" };

        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadDefaultReplay();
            setupControls();
        });

        // 自动拉取 Node.js 刚仿真完的 JSON
        function loadDefaultReplay() {
            fetch('/local_replay.json')
                .then(res => {
                    if (!res.ok) throw new Error('Default file not found');
                    return res.json();
                })
                .then(data => {
                    loadReplay(data);
                })
                .catch(err => {
                    console.log('[Viewer] No default local_replay.json found, waiting for upload.');
                    showLogMessage('请加载本地 local_replay.json 文件或在控制台运行模拟。');
                });
        }

        // 文件上传载入
        document.getElementById('fileLoader').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    loadReplay(data);
                } catch (err) {
                    alert('非法的 JSON 回放格式！');
                }
            };
            reader.readAsText(file);
        });

        function convertOfficialReplay(officialData) {
            const events = officialData.events;
            let maxFrame = 0;
            events.forEach(ev => {
                if (ev.frame > maxFrame) maxFrame = ev.frame;
            });

            // 初始化 records
            const records = [];
            for (let i = 0; i <= maxFrame; i++) {
                records.push([]);
            }

            // 提取参与的坦克名称
            const tankNamesSet = new Set();
            events.forEach(ev => {
                if (ev.tank) tankNamesSet.add(ev.tank);
            });
            const names = Array.from(tankNamesSet);
            if (names.length < 2) {
                if (names.length === 1) names.push("Opponent");
                else names.push("Challenger", "Defender");
            }

            // 将官方扁平事件按帧归入 records 数组
            events.forEach(ev => {
                records[ev.frame].push(clone(ev));
            });

            // 获取地图范围并寻找匹配的地图
            let maxX = 14;
            let maxY = 10;
            events.forEach(ev => {
                const pos = ev.at || ev.to;
                if (pos) {
                    if (pos[0] > maxX) maxX = pos[0];
                    if (pos[1] > maxY) maxY = pos[1];
                }
            });

            // 根据坐标最大宽度自动挑选经典地图 (15x11) 或走廊地图 (22x7)
            let mapTemplate = [
                "xxxxxxxxxxxxxxx",
                "x......x......x",
                "x.mm.o.m.o.mm.x",
                "x.m........m..x",
                "x...oo.m.oo...x",
                "xxm........mxxx",
                "x...oo.m.oo...x",
                "x.m........m..x",
                "x.mm.o.m.o.mm.x",
                "x......x......x",
                "xxxxxxxxxxxxxxx"
            ];
            if (maxX > 15) {
                mapTemplate = [
                    "xxxxxxxxxxxxxxxxxxxxxx",
                    "x....................x",
                    "x.x.xxx.xxxxxx.xxx.x.x",
                    "x.m.o.m...xx...m.o.m.x",
                    "x.x.xxx.xxxxxx.xxx.x.x",
                    "x....................x",
                    "xxxxxxxxxxxxxxxxxxxxxx"
                ];
            }

            const h = mapTemplate.length;
            const w = mapTemplate[0].length;

            const mapMatrix = [];
            for (let x = 0; x < w; x++) {
                mapMatrix[x] = [];
                for (let y = 0; y < h; y++) {
                    mapMatrix[x][y] = mapTemplate[y][x];
                }
            }

            // 坦克初始出生点设定
            const spawns = [
                [2, Math.floor(h / 2)],
                [w - 3, Math.floor(h / 2)]
            ];

            return {
                map: { map: mapMatrix },
                names: names,
                replay: {
                    meta: {
                        players: [
                            { tank: { id: 1, position: spawns[0], direction: "right" } },
                            { tank: { id: 2, position: spawns[1], direction: "left" } }
                        ],
                        result: {
                            winner: 0,
                            reason: "official_match"
                        }
                    },
                    records: records
                }
            };
        }

        function loadReplay(data) {
            if (data.events && Array.isArray(data.events)) {
                data = convertOfficialReplay(data);
            }
            replayData = data;
            currentFrame = 0;
            isPlaying = false;
            document.getElementById('playBtn').textContent = '播放';
            document.getElementById('playBtn').classList.remove('active');
            clearInterval(timer);

            // 设定 Slider 范围
            const maxFrame = data.replay.records.length;
            const slider = document.getElementById('timeSlider');
            slider.max = maxFrame;
            slider.value = 0;

            // 调整 Canvas 分辨率
            const w = data.map.map.length;
            const h = data.map.map[0].length;
            canvas.width = w * TILE;
            canvas.height = h * TILE;

            // 渲染
            render();
            updateStatusPanel();
            rebuildLogPanel();
        }

        function setupControls() {
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const restartBtn = document.getElementById('restartBtn');
            const slider = document.getElementById('timeSlider');

            playBtn.addEventListener('click', () => {
                if (isPlaying) {
                    pause();
                } else {
                    play();
                }
            });

            prevBtn.addEventListener('click', () => {
                pause();
                if (currentFrame > 0) {
                    currentFrame--;
                    slider.value = currentFrame;
                    render();
                    updateStatusPanel();
                }
            });

            nextBtn.addEventListener('click', () => {
                pause();
                if (replayData && currentFrame < replayData.replay.records.length) {
                    currentFrame++;
                    slider.value = currentFrame;
                    render();
                    updateStatusPanel();
                }
            });

            restartBtn.addEventListener('click', () => {
                pause();
                currentFrame = 0;
                slider.value = 0;
                render();
                updateStatusPanel();
            });

            slider.addEventListener('input', (e) => {
                pause();
                currentFrame = parseInt(e.target.value);
                render();
                updateStatusPanel();
            });

            // 速度选择
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playSpeed = parseInt(btn.dataset.speed);
                    if (isPlaying) {
                        pause();
                        play();
                    }
                });
            });
        }

        function play() {
            if (!replayData) return;
            isPlaying = true;
            document.getElementById('playBtn').textContent = '暂停';
            document.getElementById('playBtn').classList.add('active');

            // 每秒播放帧数，游戏基础是 300ms 一帧，大约 3.3 帧/秒。倍速对应相应速率。
            const intervalMs = Math.max(30, 300 / playSpeed);
            timer = setInterval(() => {
                if (currentFrame < replayData.replay.records.length) {
                    currentFrame++;
                    document.getElementById('timeSlider').value = currentFrame;
                    render();
                    updateStatusPanel();
                } else {
                    pause();
                }
            }, intervalMs);
        }

        function pause() {
            isPlaying = false;
            document.getElementById('playBtn').textContent = '播放';
            document.getElementById('playBtn').classList.remove('active');
            clearInterval(timer);
        }

        function render() {
            if (!replayData) return;

            const map = replayData.map.map;
            const w = map.length;
            const h = map[0].length;

            // 1. 绘制地图底图
            ctx.fillStyle = '#0f141c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格线
            ctx.strokeStyle = '#1d242e';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= w; x++) {
                ctx.beginPath();
                ctx.moveTo(x * TILE, 0);
                ctx.lineTo(x * TILE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= h; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * TILE);
                ctx.lineTo(canvas.width, y * TILE);
                ctx.stroke();
            }

            // 2. 绘制静态格子 (从当前帧的状态推演物理图块)
            // 我们需要根据 frames 来推演土堆是否被击毁。
            const currentMap = clone(map);

            // 扫描当前帧以前的所有 events，把被摧毁的土堆抹去
            for (let f = 0; f < currentFrame; f++) {
                const events = replayData.replay.records[f] || [];
                events.forEach(ev => {
                    if (ev.event === "shot_mound" && ev.at) {
                        currentMap[ev.at[0]][ev.at[1]] = ".";
                    }
                });
            }

            for (let x = 0; x < w; x++) {
                for (let y = 0; y < h; y++) {
                    const tile = currentMap[x][y];
                    if (tile === 'x') {
                        // 灰色石墙
                        ctx.fillStyle = '#30363d';
                        ctx.fillRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);
                    } else if (tile === 'm') {
                        // 棕色土堆
                        ctx.fillStyle = '#8a5b13';
                        ctx.fillRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);
                        // 绘制土堆小裂纹符号
                        ctx.strokeStyle = '#5c3d0d';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(x * TILE + 8, y * TILE + 8);
                        ctx.lineTo(x * TILE + TILE - 8, y * TILE + TILE - 8);
                        ctx.stroke();
                    } else if (tile === 'o') {
                        // 绿色草丛
                        ctx.fillStyle = 'rgba(46, 125, 50, 0.4)';
                        ctx.fillRect(x * TILE + 1, y * TILE + 1, TILE - 2, TILE - 2);
                    }
                }
            }

            // 3. 计算并绘制当前帧的动态元素 (坦克位置、子弹等)
            // 从 Meta 获取初始位置
            let p0 = clone(replayData.replay.meta.players[0].tank);
            let p1 = clone(replayData.replay.meta.players[1].tank);
            p0.crashed = false;
            p1.crashed = false;
            p0.shielded = false;
            p1.shielded = false;
            p0.overloaded = false;
            p1.overloaded = false;

            let starPosition = null;
            let activeBullets = [];

            // 逐帧演进还原位置与子弹
            for (let f = 0; f < currentFrame; f++) {
                const events = replayData.replay.records[f] || [];

                // 还原星星
                events.forEach(ev => {
                    if (ev.event === "star_spawned") starPosition = ev.at;
                    if (ev.event === "star_collected") starPosition = null;
                });

                events.forEach(ev => {
                    const isP0 = ev.tank === "Challenger";
                    const p = isP0 ? p0 : p1;

                    if (ev.event === "move" && ev.to) {
                        p.position = ev.to;
                    } else if (ev.event === "turn" && ev.direction) {
                        p.direction = turn(p.direction, ev.direction);
                    } else if (ev.event === "skill_applied" && ev.skill === "teleport" && ev.to) {
                        p.position = ev.to;
                    } else if (ev.event === "skill_applied" && ev.skill === "shield") {
                        p.shielded = true;
                    } else if (ev.event === "skill_expired" && ev.skill === "shield") {
                        p.shielded = false;
                    } else if (ev.event === "skill_applied" && ev.skill === "overload") {
                        p.overloaded = true;
                    } else if (ev.event === "skill_expired" && ev.skill === "overload") {
                        p.overloaded = false;
                    } else if (ev.event === "crashed") {
                        p.crashed = true;
                    }
                });

                // 还原当前帧子弹 (根据最后一帧 events 的弹道位置计算)
                // 收集这帧生成的子弹移动
                activeBullets = []; // 每次重算
                events.forEach(ev => {
                    if (ev.event === "fire" && ev.bullet) {
                        // 预备子弹，此时在车身
                        activeBullets.push({
                            id: ev.bullet,
                            position: isP0(ev) ? clone(p0.position) : clone(p1.position),
                            direction: ev.direction,
                            color: isP0(ev) ? varColor('--accent-red') : varColor('--accent-blue')
                        });
                    }
                    if (ev.event === "move" && ev.bullet) {
                        // 物理移动
                        const idx = activeBullets.findIndex(b => b.id === ev.bullet);
                        if (idx !== -1) {
                            activeBullets[idx].position = ev.position || ev.to;
                        }
                    }
                });
            }

            function isP0(ev) {
                const tName = ev.tank || (ev.bullet && ev.bullet.split('-')[1]);
                if (tName) {
                    return tName === replayData.names[0] || tName === 'Challenger';
                }
                return false;
            }

            // 绘制星星
            if (starPosition) {
                ctx.fillStyle = '#ffdf5d';
                ctx.strokeStyle = '#d29922';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                const cx = starPosition[0] * TILE + TILE / 2;
                const cy = starPosition[1] * TILE + TILE / 2;
                // 画五角星/闪烁八角星
                ctx.arc(cx, cy, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // 寻找双方最近的 speak 消息（5帧内）
            let p0Speak = null;
            let p1Speak = null;
            const speakWindow = 5;
            const startCheckFrame = Math.max(0, currentFrame - speakWindow);
            for (let f = startCheckFrame; f < currentFrame; f++) {
                const events = replayData.replay.records[f] || [];
                events.forEach(ev => {
                    if (ev.event === "speak") {
                        if (ev.tank === replayData.names[0] || ev.tank === "Challenger") p0Speak = ev.message;
                        else if (ev.tank === replayData.names[1] || ev.tank === "Defender") p1Speak = ev.message;
                    }
                });
            }

            // 绘制双方坦克
            drawTank(p0, '#ff7b72', replayData.names[0], p0Speak);
            drawTank(p1, '#58a6ff', replayData.names[1], p1Speak);

            // 绘制飞行的子弹
            activeBullets.forEach(b => {
                drawBullet(b.position, b.direction, b.color);
            });

            rebuildLogPanel();
        }

        function drawTank(tank, color, label, speakText) {
            if (tank.crashed) return;

            const x = tank.position[0];
            const y = tank.position[1];

            // 1. 坦克底盘
            ctx.fillStyle = color;
            ctx.fillRect(x * TILE + 6, y * TILE + 6, TILE - 12, TILE - 12);

            // 2. 炮管朝向
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            const cx = x * TILE + TILE / 2;
            const cy = y * TILE + TILE / 2;
            ctx.moveTo(cx, cy);
            if (tank.direction === 'up') ctx.lineTo(cx, cy - TILE / 2 + 2);
            else if (tank.direction === 'down') ctx.lineTo(cx, cy + TILE / 2 - 2);
            else if (tank.direction === 'left') ctx.lineTo(cx - TILE / 2 + 2, cy);
            else if (tank.direction === 'right') ctx.lineTo(cx + TILE / 2 - 2, cy);
            ctx.stroke();

            // 3. 护盾特效
            if (tank.shielded) {
                ctx.strokeStyle = '#58a6ff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, cy, TILE / 2 + 2, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 4. 过载特效
            if (tank.overloaded) {
                ctx.fillStyle = '#ffd33d';
                ctx.beginPath();
                ctx.arc(cx - TILE / 2 + 6, cy - TILE / 2 + 6, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // 5. 绘制 speak 气泡
            if (speakText) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.font = "bold 11px sans-serif";

                const textWidth = ctx.measureText(speakText).width;
                const padX = 8;
                const padY = 4;
                const bw = textWidth + padX * 2;
                const bh = 18;
                const bx = cx - bw / 2;
                const by = y * TILE - 12;

                // 气泡圆角矩形背景
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 4);
                ctx.fill();
                ctx.stroke();

                // 气泡文本
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(speakText, cx, by + bh / 2 + 1);
            }
        }

        function drawBullet(pos, dir, color) {
            const cx = pos[0] * TILE + TILE / 2;
            const cy = pos[1] * TILE + TILE / 2;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function turn(current, commandDir) {
            return commandDir === "left" ? turnLeft[current] : turnRight[current];
        }

        function varColor(cssVar) {
            return getComputedStyle(document.documentElement).getPropertyValue(cssVar).trim();
        }

        // 更新状态监测面板
        function updateStatusPanel() {
            if (!replayData) return;

            document.getElementById('timeLabel').textContent = `${currentFrame} / ${replayData.replay.records.length} 帧`;

            // 胜负状态
            const meta = replayData.replay.meta;
            const winnerIdx = meta.result.winner;
            const name0 = replayData.names[0] || 'Challenger';
            const name1 = replayData.names[1] || 'Defender';

            document.getElementById('p0Name').textContent = name0;
            document.getElementById('p1Name').textContent = name1;

            const reason = meta.result.reason;
            let winnerText = 'Winner: ';
            if (winnerIdx === 0) winnerText += name0;
            else if (winnerIdx === 1) winnerText += name1;
            else winnerText += '平局';
            winnerText += ` (${reason})`;

            document.getElementById('matchWinner').textContent = winnerText;

            // 双方基础数值还原
            let p0 = clone(replayData.replay.meta.players[0].tank);
            let p1 = clone(replayData.replay.meta.players[1].tank);
            let p0Stars = 0, p1Stars = 0;

            for (let f = 0; f < currentFrame; f++) {
                const events = replayData.replay.records[f] || [];
                events.forEach(ev => {
                    if (ev.tank === name0 || ev.tank === "Challenger") {
                        if (ev.event === "move" && ev.to) p0.position = ev.to;
                        if (ev.event === "skill_applied" && ev.skill === "teleport" && ev.to) p0.position = ev.to;
                        if (ev.event === "star_collected") p0Stars++;
                    } else if (ev.tank === name1 || ev.tank === "Defender") {
                        if (ev.event === "move" && ev.to) p1.position = ev.to;
                        if (ev.event === "skill_applied" && ev.skill === "teleport" && ev.to) p1.position = ev.to;
                        if (ev.event === "star_collected") p1Stars++;
                    }
                });
            }

            document.getElementById('p0Pos').textContent = `坐标: [${p0.position[0]}, ${p0.position[1]}]`;
            document.getElementById('p0Stars').textContent = `星星: ${p0Stars} ★`;
            document.getElementById('p1Pos').textContent = `坐标: [${p1.position[0]}, ${p1.position[1]}]`;
            document.getElementById('p1Stars').textContent = `星星: ${p1Stars} ★`;
        }

        // 重组日志显示
        function rebuildLogPanel() {
            const panel = document.getElementById('eventLogPanel');
            panel.innerHTML = '';
            if (!replayData) return;

            for (let f = 0; f < currentFrame; f++) {
                const events = replayData.replay.records[f] || [];
                events.forEach(ev => {
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';

                    let text = `[帧 ${f}] ${ev.tank || '系统'}: `;
                    if (ev.event === "fire") {
                        text += `射击 🔫 子弹 ID = ${ev.bullet || ''}`;
                    } else if (ev.event === "move") {
                        text += `移动到 [${ev.to || ''}]`;
                    } else if (ev.event === "turn") {
                        text += `转向 ${ev.direction || ''}`;
                    } else if (ev.event === "star_spawned") {
                        text = `[帧 ${f}] 系统: 星星刷新在 [${ev.at || ''}]`;
                        entry.className += ' highlight';
                    } else if (ev.event === "star_collected") {
                        text += `成功抢到星星 ⭐`;
                        entry.className += ' highlight';
                    } else if (ev.event === "skill_cast") {
                        text += `释放了技能 [${ev.skill || ''}] ⚡`;
                    } else if (ev.event === "crashed") {
                        text += `坦克撞毁爆破！💥`;
                        entry.className += ' crash';
                    } else if (ev.event === "shot_mound") {
                        text = `[帧 ${f}] 系统: ${ev.tank || ''} 的子弹击碎了土堆 [${ev.at || ''}]`;
                    } else if (ev.event === "speak") {
                        text += `播报：“${ev.message || ''}” 💬`;
                        entry.className += ' highlight';
                    }
                    entry.textContent = text;
                    panel.appendChild(entry);
                });
            }
            panel.scrollTop = panel.scrollHeight; // 滚动到底部
        }

        function showLogMessage(msg) {
            const panel = document.getElementById('eventLogPanel');
            panel.innerHTML = `<div class="log-entry highlight">${msg}</div>`;
        }
    </script>
